name: CI workflow
on:
  push:
    branches: 
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          npm ci

      - names: Lint with ESLint
        run: |
          npm run lint

      - names: Run unit tests with Jest
        run: |
          npm test -- --coverage